<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Page Not Found | 10K Analytics</title>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<link rel="stylesheet" href="css/styles.css">

<style>

body{

    margin:0;

    background:#222B31;

    color:white;

    font-family:Arial, Helvetica, sans-serif;

}

.error-page{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:40px;

}

.error-box{

    max-width:650px;

}

.error-box h1{

    font-size:5rem;

    color:#D8F54A;

    margin-bottom:10px;

}

.error-box h2{

    font-size:2rem;

    margin-bottom:20px;

}

.error-box p{

    color:#C5CDD3;

    line-height:1.7;

    margin-bottom:40px;

}

.home-button{

    display:inline-block;

    background:#D8F54A;

    color:#222B31;

    text-decoration:none;

    font-weight:700;

    padding:16px 34px;

    border-radius:8px;

    transition:.25s;

}

.home-button:hover{

    background:white;

}

</style>

</head>

<body>

<div class="error-page">

    <div class="error-box">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>

            The page you're looking for may have been moved,
            renamed, or no longer exists.

        </p>

        <a href="/" class="home-button">

            Return to Homepage

        </a>

    </div>

</div>

</body>

</html>
